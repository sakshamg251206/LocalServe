[project]
name = "localserve"
version = "0.1.0"
description = "Measured LLM serving on Apple Silicon: gateway, load generator, quality gate"
readme = "README.md"
authors = [
    { name = "Saksham Garg", email = "sakshamgarg87@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
localserve-gateway = "localserve.gateway.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs llama.cpp binaries and a GGUF model (skipped when absent)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".vendor", "models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
